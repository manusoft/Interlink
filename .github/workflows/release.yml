name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Pack
        run: |
          mkdir -p nupkgs
          dotnet pack src/Interlink/Interlink.csproj                         -c Release -o ./nupkgs --no-build
          dotnet pack src/Interlink.Extensions.Logging/Interlink.Extensions.Logging.csproj -c Release -o ./nupkgs --no-build
          dotnet pack src/Interlink.Extensions.Validation/Interlink.Extensions.Validation.csproj -c Release -o ./nupkgs --no-build
          dotnet pack src/Interlink.AspNetCore/Interlink.AspNetCore.csproj  -c Release -o ./nupkgs --no-build
          dotnet pack src/Interlink.Analyzers/Interlink.Analyzers.csproj     -c Release -o ./nupkgs --no-build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*.nupkg

  publish:
    needs: build-and-pack
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # ← This step was missing!
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate